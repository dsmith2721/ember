<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember</title>
<meta name="description" content="Keep your faith fire lit.">
<meta name="theme-color" content="#2B1745">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ember">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&display=swap">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
:root{--night:#1A0E2B;--plum:#2B1745;--cream:#FFF3DC;--ember:#FF8A3D;--bg:#F5F2F9;--sf:#fff;--sf2:#ECE6F3;--ink:#2B1745;--mut:#6B5B80;--ac:#F5B042;--acd:#9A5A00;--ln:#DDD3E8;--ok:#2E7D5B;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1E1030;--sf:#2B1745;--sf2:#38205A;--ink:#F4EEFA;--mut:#B7A6CC;--ac:#F5B042;--acd:#F5B042;--ln:#47306B;--ok:#6FD3A3;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overscroll-behavior:none}html{-webkit-text-size-adjust:100%}
body{height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
h1,h2,h3,.serif{font-family:"Fraunces","Iowan Old Style",Georgia,serif;font-weight:650;font-variation-settings:"SOFT" 100;letter-spacing:-.01em;margin:0}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:var(--night);color:var(--cream)}
header .btn.ghost{background:#ffffff17;color:var(--cream)}
header .logo{width:34px;height:34px;border-radius:9px;flex:none}
header h1{font-size:24px;flex:1}
main{flex:1;overflow:auto;padding:4px 18px 24px;max-width:640px;width:100%;margin:0 auto}



button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:18px;margin:0 0 14px}
.card>h3{font-size:22px;margin:0 0 4px}
.btn{background:var(--ac);color:#2B1745;border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none}
.btn.ghost{background:var(--sf2);color:var(--ink)}
.btn:disabled{opacity:.5}
input,select,textarea{font-size:16px;width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;margin:4px 0 10px}
.row{display:flex;gap:8px;align-items:center}.row>*{margin:0}
.mut{color:var(--mut);font-size:14px}
.h{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.h:last-child{border:0}.h .t{flex:1}
/* Today */
.hero2{position:relative;overflow:hidden;margin:-4px -18px 0;padding:6px 20px 52px;background:var(--night);color:var(--cream);text-align:center;border-radius:0 0 32px 32px}
.hero2 .dt{margin:0;color:#B7A6CC;font-size:14px}
.fl{width:176px;height:212px;margin:0 auto}
.fl svg{width:100%;height:100%;overflow:visible}
.fl{cursor:pointer;border-radius:24px;-webkit-tap-highlight-color:transparent}
.fl:focus-visible{outline:3px solid var(--ac);outline-offset:4px}
.fl[data-flick="1"] .outer{animation-duration:3.4s!important}.fl[data-flick="1"] .core{animation-duration:2.3s!important}
.fl[data-flick="2"] .outer,.fl[data-flick="2"] .core{animation:none!important}
.fl .body{transform-origin:100px 225px;transform:scale(calc(.3 + .7*var(--p,0)))}
.fl .glow{transform-origin:100px 150px;opacity:calc(.12 + .88*var(--p,0));transform:scale(calc(.5 + .6*var(--p,0) + .07*var(--t,0)))}
.fl[data-zero] .body{filter:saturate(.2) brightness(.75)}
.big{font-size:42px;line-height:1.05;font-weight:600;font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.025em;margin-top:-4px}
.hs{margin:6px 0 0;color:#D9CBEA}
.tier{display:inline-flex;gap:8px;align-items:baseline;margin:12px 0 0;padding:4px 14px;border:1px solid #F5B04270;border-radius:999px;font-size:13px;color:#B7A6CC}
.tier b{color:#FFD98A}
.tier[hidden]{display:none}
.wk{display:flex;justify-content:center;gap:12px;margin-top:20px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:3px;width:26px;font-size:12px;color:#8E7FA3}
.wk div.now{color:var(--cream);font-weight:700}
.wk svg{width:20px;height:24px}
.wk .full svg{filter:drop-shadow(0 0 5px #FF8A3D)}
.sheet{position:relative;margin:-26px 0 14px;background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:2px 16px}
.hr{display:flex;align-items:center;gap:14px;width:100%;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--ln);color:inherit;text-align:left;cursor:pointer}
.hr:last-child{border-bottom:0}
.hr b{display:block;font-weight:600;font-size:17px}
.ring{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;color:transparent}
.ring svg{width:20px;height:24px}
.hr:hover .ring{border-color:var(--ac)}
.hr[aria-pressed=true] .ring{background:var(--ac);border-color:var(--ac);color:var(--plum);box-shadow:0 0 0 6px #F5B04230}
.empty{padding:18px 4px;text-align:center}
/* Tab bands and lists */
.band{margin:-4px -18px 0;padding:8px 22px 50px;background:var(--night);color:var(--cream);border-radius:0 0 32px 32px}
.band h2{font-size:38px;line-height:1.05;font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.025em}
.band>p{margin:8px 0 0;color:#D9CBEA;max-width:36ch}
.band+.card{position:relative;margin-top:-28px}
.bt{display:flex;align-items:center;gap:10px}.bt h2{flex:1;text-align:center}
.nb{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#ffffff17;color:var(--cream);display:grid;place-items:center;cursor:pointer}
.nb:hover{background:#ffffff26}
.ctl{display:grid;grid-template-columns:1fr 78px;gap:8px;margin-top:18px}
.band select,.band input{margin:0;background:#ffffff12;border-color:#ffffff24;color:var(--cream);border-radius:12px}
.band option{color:#2B1745;background:#fff}
.list{padding:4px 16px}.list>h3{padding:14px 2px 2px}
.pl,.lk{display:flex;align-items:center;gap:14px;width:100%;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--ln);color:inherit;text-align:left;text-decoration:none;cursor:pointer;font:inherit}
.pl:last-child,.lk:last-child{border-bottom:0}
.pl .t,.lk .t,.h .t{flex:1;min-width:0}.pl b,.lk b{display:block;font-weight:600;font-size:17px}
.pill{flex:none;background:var(--sf2);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.pl:hover .pill{box-shadow:inset 0 0 0 2px var(--ac)}
.pl[aria-current=true] .pill{background:var(--ac);color:#2B1745}
.lk svg{flex:none;color:var(--mut)}
.tn{margin:0}
.lightbtn{display:inline-flex;align-items:center;gap:12px;margin:18px 0 4px;padding:6px 20px 6px 6px;border:0;border-radius:999px;background:var(--sf2);color:var(--ink);font-weight:700;cursor:pointer}
.lightbtn .ring{width:38px;height:38px}
.lightbtn[aria-pressed=true] .ring{background:var(--ac);border-color:var(--ac);color:#2B1745}
.btn.sm{padding:6px 14px;font-size:14px}
textarea{resize:vertical}
/* Tab bar */
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln);box-shadow:0 -6px 18px #2B174512;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}


/* Share Ember */
.hbtn{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:#ffffff17;color:var(--cream);cursor:pointer}
.hbtn:hover{background:#ffffff26}
.hbtn svg,.way svg,.btn.wide svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.invite{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.invite>div{flex:1 1 200px}
.btn.wide{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;padding:13px}
.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.way{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--sf2);color:var(--ink)!important;text-decoration:none;font-weight:700;font-size:13px}
.way:hover{box-shadow:inset 0 0 0 2px var(--ac)}
.linkrow{display:flex;gap:8px;align-items:center}.linkrow input{margin:0;flex:1;min-width:0;font-size:14px}
@media(max-width:400px){header h1{flex-direction:column;gap:0;line-height:1}.beta{font-size:10px}.hbtn{width:36px;height:36px}}
/* Header beta + compact customize */
header h1{display:flex;align-items:baseline;gap:6px;white-space:nowrap;min-width:0}
.beta{font:600 11px system-ui,sans-serif;color:#B7A6CC;letter-spacing:.01em}
#cust{display:inline-flex;align-items:center;gap:6px}
#cust .gear{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
@media(max-width:480px){#cust .cl{display:none}#cust{padding:10px 11px}header{gap:8px}}
/* Devotionals | Books switch */
.seg2{display:inline-flex;gap:4px;margin-top:16px;padding:4px;border-radius:999px;background:#ffffff14}
.seg2 button{border:0;background:none;color:#D9CBEA;font:700 14px system-ui,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}
.seg2 button[aria-selected=true]{background:#F5B042;color:#2B1745}
/* Add your own */
.addf{border-top:1px solid var(--ln);margin-top:6px;padding:4px 2px 12px}
.addf input{margin:4px 0 8px}
.addf .am{margin:6px 0 0}
.rm{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);background:none;color:var(--mut);font-size:18px;line-height:1;cursor:pointer}
.rm:hover{color:var(--ink);border-color:var(--mut)}
.prow .pl{flex:1 1 200px}
nav button{user-select:none;-webkit-user-select:none;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:2px 0;color:var(--mut);font:700 11.5px/1.2 system-ui,-apple-system,sans-serif;letter-spacing:.01em;cursor:pointer}
nav .ic{display:grid;place-items:center;width:46px;height:30px;border-radius:999px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{color:var(--ink)}
nav button[aria-selected=true] .ic{background:#F5B04238;color:var(--acd)}
nav button[aria-selected=true] svg{stroke-width:2.2}
@media(prefers-reduced-motion:no-preference){nav .ic{transition:background .2s}}
nav button{font-size:11px}
@media(max-width:400px){nav .ic{width:38px}nav button{font-size:10px;letter-spacing:0}}
@media(max-width:340px){nav .ic{width:32px}nav button{font-size:9.5px}}
/* Ember economy */
header h1{flex:0 1 auto;margin-right:auto}
.bal{display:inline-flex;align-items:center;gap:6px;border:1px solid #F5B04255;background:#F5B0421a;color:#FFD98A;border-radius:999px;padding:7px 12px 7px 9px;font:700 15px system-ui;cursor:pointer}
.bal svg{width:14px;height:17px;color:#F5B042}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 68px);transform:translate(-50%,-12px);max-width:min(92vw,440px);padding:10px 16px;border-radius:16px;background:#2B1745;color:#FFF3DC;border:1px solid #F5B04288;box-shadow:0 10px 30px #0006;font-weight:600;font-size:15px;text-align:center;opacity:0;pointer-events:none;z-index:30;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto;width:min(92vw,420px);justify-content:space-between;display:flex;align-items:center;gap:12px;text-align:left}
.toast button{flex:none;border:0;border-radius:999px;background:#F5B042;color:#2B1745;font:800 14px system-ui,sans-serif;padding:7px 14px;cursor:pointer}
.plus{position:fixed;z-index:25;pointer-events:none;font:800 18px system-ui;color:#F5B042;text-shadow:0 1px 0 #2B1745,0 0 10px #FF8A3D88;transform:translate(-50%,0)}
.gain{flex:none;font-weight:700;color:var(--acd);font-size:15px;min-width:36px;text-align:right}
.gain .mut{font-weight:500;font-size:13px}.gain .mut::before{content:"+"}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.gh h3{margin:0}
.eg{padding:10px 0 12px;border-bottom:1px solid var(--ln)}
.bar{height:12px;border-radius:999px;background:var(--sf2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF7A2E,#F5B042,#FFD98A)}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .6s cubic-bezier(.2,.9,.3,1)}}
.qr{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--ln)}
.card .qr:last-of-type{border-bottom:0}
.qr .t{flex:1}
.qc{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;color:#2B1745}
.qc svg{width:12px;height:14px}
.qr.ok .qc{background:var(--ac);border-color:var(--ac)}
.qr.ok .t{color:var(--mut)}
.rw{flex:none;font-weight:700;color:var(--acd);font-size:15px}.qr.ok .rw{color:var(--ok)}
.clock{font:600 64px/1 "Fraunces",Georgia,serif;text-align:center;margin:22px 0;font-variant-numeric:tabular-nums}
.jarband{text-align:center}
.jarband .jar{width:150px;height:186px;display:block;margin:4px auto 0}
.jarband h2{font-size:52px;margin-top:4px}
.jarband .jl{margin:0 auto;color:#B7A6CC}
.jarband>p{margin:14px auto 0}
.chips{display:flex;gap:8px;justify-content:center;margin-top:14px}
.pill.dark{display:inline-flex;align-items:center;gap:6px;background:#ffffff14;color:var(--cream)}
.pill.dark svg{width:16px;height:16px}
@media(prefers-reduced-motion:no-preference){.jd{animation:drop .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d)}}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.seg button{border:2px solid var(--ln);background:var(--bg);border-radius:14px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button b{font-size:14px}.seg button span{font-size:13px;color:var(--mut)}
.seg button[aria-checked=true]{border-color:var(--ac);background:#F5B04222}
.sk{display:flex;align-items:center;gap:14px;margin:8px 0 14px}
.skn{font:600 56px/1 "Fraunces",Georgia,serif;color:var(--acd)}
.sk>span:last-child{display:flex;flex-direction:column}
.fz{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln);margin-bottom:10px}
.fz .t{display:flex;flex-direction:column}.fzi{display:flex;gap:2px;color:var(--mut)}
.yr{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.ym{display:grid;grid-template-columns:30px repeat(31,1fr);gap:2px;align-items:center}
.ym span{font-size:12px;color:var(--mut)}
.ym i{aspect-ratio:1;border-radius:50%;background:var(--sf2)}
.ym i.on{background:#F5B042;opacity:calc(.3 + .7*var(--f))}
.ym i.full{box-shadow:0 0 5px #FF8A3D}
.ym i.ice{background:#8FC9FF;opacity:.8}
.icon-ice svg{width:20px;height:24px}
.hint{margin:0 0 4px;font-size:13px}
.verses p[data-v]{cursor:pointer;border-radius:8px;margin-inline:-6px;padding-inline:6px}
.verses p[data-v]:hover{background:var(--sf2)}
.verses p.kept{background:#F5B04224;box-shadow:inset 3px 0 var(--ac)}
.quiz{font:400 20px/1.8 "Fraunces",Georgia,serif;margin:14px 0}
.blank{display:inline-block;height:1.1em;vertical-align:-.15em;border-bottom:2px solid var(--ac);background:#F5B0421a;border-radius:4px 4px 0 0}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tog .mut{margin-left:4px}
.hr.held{opacity:.55}
.hr .t{flex:1;min-width:0}
/* Favorites */
.fav{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--ln);display:grid;place-items:center;cursor:pointer;padding:0}
.fav svg{width:17px;height:20px}
.fav:hover{color:var(--ac)}
.fav[aria-pressed=true]{color:#F5B042;filter:drop-shadow(0 0 5px #FF8A3D99)}
.band .fav{color:#ffffff40}.band .fav[aria-pressed=true]{color:#F5B042}
.inl svg{width:12px;height:14px;vertical-align:-2px;color:#F5B042}
.trrow{grid-column:1/-1;display:flex;gap:6px;align-items:center}.trrow select{flex:1;min-width:0}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin:0 2px 12px}
.chip{display:inline-block;padding:7px 14px;border-radius:999px;background:#F5B04226;border:1px solid #F5B04288;color:var(--ink)!important;font-weight:700;font-size:14px;text-decoration:none}
.chip:hover{background:#F5B04244}
.prow{padding:0;gap:4px}.prow .pl{border:0}
.lk2{display:flex;flex-direction:column;color:inherit!important;text-decoration:none}.lk2:hover b{text-decoration:underline;text-decoration-color:var(--ac)}
.fp .t{min-width:0;flex:1 1 150px}
.fp{flex-wrap:wrap;row-gap:6px}.pb{margin-left:auto}
.card a.pill{text-decoration:none}


.ph{margin:14px 2px 2px;font:700 14px system-ui;color:var(--mut)}
.fp .t{display:flex;flex-direction:column}
.pb{display:flex;gap:6px;flex:none}.pb .pill{text-decoration:none}
.pb .pill:hover{box-shadow:inset 0 0 0 2px var(--ac)}
.cu .sch{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px 32px}
.sch select,.sch input{width:auto;margin:0;padding:7px 9px;font-size:15px}
.dm{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}.dm input{width:64px}
.sch[hidden],.sch [hidden]{display:none}

.card a{color:var(--acd)}
.card a.lk,.card a.pill{color:var(--ink)}
.h a.t{color:inherit;text-decoration:none}.h a.t:hover b{text-decoration:underline;text-decoration-color:var(--ac);text-underline-offset:3px}
.emb{position:fixed;width:6px;height:6px;margin:-3px;border-radius:50%;background:#FFC266;box-shadow:0 0 10px 2px #FF8A3D;pointer-events:none;z-index:9}
@media(prefers-reduced-motion:no-preference){
.fl .body{transition:transform .9s cubic-bezier(.2,.9,.3,1.25),filter .9s}
.fl .glow{transition:opacity .9s,transform .9s}
.fl .outer{transform-origin:256px 450px;animation:flick 1.7s ease-in-out infinite}
.fl .core{transform-origin:256px 440px;animation:flick 1.15s ease-in-out infinite reverse}
.ring{transition:background .25s,border-color .25s,box-shadow .4s,color .25s}}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(1.04) skewX(-1.6deg)}62%{transform:scaleY(.97) skewX(1.2deg)}}
.verses{margin-top:10px}
.verses p{font-family:"Fraunces","Iowan Old Style",Georgia,serif;font-variation-settings:"opsz" 14;font-size:19px;line-height:1.75;margin:0 0 8px;max-width:62ch}
.verses sup{color:var(--acd);font:700 11px system-ui;margin-right:3px}
mark{background:var(--ac);color:#2B1745;border-radius:4px;padding:0 3px}
details{border-bottom:1px solid var(--ln)}details:last-child{border-bottom:0}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 2px;font-weight:600;font-size:17px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:8px;height:8px;margin-right:6px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:translateY(-3px) rotate(45deg)}
details[open] summary::after{transform:translateY(2px) rotate(-135deg)}
details ul{margin:0 0 16px;padding-left:22px}details li{margin:6px 0;line-height:1.55}
