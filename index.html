:root{--bg:#F5F2F9;--sf:#fff;--sf2:#ECE6F3;--ink:#2B1745;--mut:#6B5B80;--ac:#F5B042;--acd:#9A5A00;--ln:#DDD3E8;--ok:#2E7D5B;color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overscroll-behavior:none}html{-webkit-text-size-adjust:100%}
body{height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
h1,h2,h3,.serif{font-family:"Iowan Old Style",Georgia,serif;font-weight:700;margin:0}
header{display:flex;align-items:center;gap:10px;padding:12px 18px}
header img{width:34px;height:34px;border-radius:9px}
header h1{font-size:24px;flex:1}
main{flex:1;overflow:auto;padding:4px 18px 24px;max-width:640px;width:100%;margin:0 auto}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{user-select:none;-webkit-user-select:none;flex:1;background:none;border:0;color:var(--mut);padding:12px 2px;font:600 13px system-ui;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 3px var(--ac)}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:0 0 14px}
.btn{background:var(--ac);color:#2B1745;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none}
.btn.ghost{background:var(--sf2);color:var(--ink)}
.btn:disabled{opacity:.5}
input,select,textarea{font-size:16px;width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;margin:4px 0 10px}
.row{display:flex;gap:8px;align-items:center}.row>*{margin:0}
.mut{color:var(--mut);font-size:14px}
.hero{display:flex;align-items:center;gap:16px}
.hero svg{width:92px;height:110px;flex:none}
.hero h2{font-size:26px;line-height:1.15}
.h{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.h:last-child{border:0}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);background:none;flex:none;cursor:pointer;display:grid;place-items:center;font-size:16px;font-weight:900;color:#2B1745;padding:0}
.chk[aria-pressed=true]{background:var(--ac);border-color:var(--ac)}
.h .t{flex:1}.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--sf2)}.dots i.on{background:var(--ac)}
.verses p{font-family:"Iowan Old Style",Georgia,serif;font-size:18px;line-height:1.7;margin:0 0 6px}
.verses sup{color:var(--acd);font:700 11px system-ui;margin-right:3px}
mark{background:var(--ac);color:#2B1745;border-radius:4px;padding:0 3px}
details{border-bottom:1px solid var(--ln);padding:10px 0}summary{font-weight:700;cursor:pointer}
details ul{margin:8px 0 0;padding-left:20px}details li{margin:4px 0}
dialog{border:0;border-radius:18px;background:var(--bg);color:var(--ink);max-width:520px;width:calc(100% - 24px);max-height:85vh;padding:18px}
dialog::backdrop{background:#0008}
.tog{display:flex;gap:10px;align-items:center;padding:7px 0}.tog input{width:22px;height:22px;margin:0;accent-color:#F5B042}
.sub{margin:16px 0 4px;font-size:17px}
.err{color:var(--acd);font-weight:600}
@media(prefers-reduced-motion:no-preference){.flm{transition:transform .5s ease,opacity .5s}}
</style>

const HABITS=[
["bible","Bible reading","Your list"],["study","Bible study","Your list"],["pray","Prayer","Your list"],["fast","Fasting","Your list"],["tithe","Tithing","Your list"],["devo","Devotionals","Your list"],["sun","Sunday service","Your list"],["mid","Mid-week service","Your list"],["lead","Leading a small group","Your list"],["vol","Volunteering","Your list"],["miss","Missions trip","Your list"],["testi","Giving testimony","Your list"],["wn","Witnessing: neighbors","Your list"],["wf","Witnessing: friends","Your list"],["ws","Witnessing: strangers","Your list"],
["journal","Gratitude journaling","Suggested"],["memo","Scripture memory","Suggested"],["worship","Worship time","Suggested"],["kind","Act of kindness","Suggested"],["acct","Accountability check-in","Suggested"],["sabbath","Sabbath rest","Suggested"],["host","Hospitality: meal with someone","Suggested"],["forgive","Forgiveness or reconciliation","Suggested"]];
let S;try{S=JSON.parse(localStorage.getItem("ember"))}catch(e){}
S=Object.assign({on:["bible","pray","devo","sun"],log:{},tithe:"",links:[],denom:"Nondenominational / Evangelical",tr:"web",book:"John",ch:1},S||{});
const save=()=>{try{localStorage.setItem("ember",JSON.stringify(S))}catch(e){}};
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString("en-CA")};
const done=(id,d=day())=>(S.log[d]||[]).includes(id);
function toggle(id){const d=day(),a=S.log[d]||(S.log[d]=[]);const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save()}
const mark=id=>{if(!done(id)){toggle(id)}};
const name=id=>HABITS.find(h=>h[0]==id)[1];

/* ---------- Today ---------- */
function flame(p){const y=110-(110*p);return `<svg viewBox="0 0 100 120" aria-hidden="true"><defs><clipPath id="cp"><rect class="flm" x="0" y="${y+5}" width="100" height="120"/></clipPath></defs><path d="M50 4C60 28 82 40 82 70C82 94 68 112 50 112C32 112 18 94 18 70C18 56 26 46 34 36C35 48 41 52 45 52C41 34 45 18 50 4Z" fill="var(--sf2)"/><path clip-path="url(#cp)" d="M50 4C60 28 82 40 82 70C82 94 68 112 50 112C32 112 18 94 18 70C18 56 26 46 34 36C35 48 41 52 45 52C41 34 45 18 50 4Z" fill="#F5B042"/></svg>`}
function today(){
const on=S.on,n=on.filter(i=>done(i)).length,p=on.length?n/on.length:0;
const msg=!on.length?"Pick what you want to track":n==on.length?"All lit today":n?`${n} of ${on.length} done today`:"Light the first one";
let h=`<div class="card hero">${flame(p)}<div><h2 class="serif">${msg}</h2><p class="mut" style="margin:4px 0 0">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p></div></div><div class="card">`;
if(!on.length)h+=`<p>No habits yet. Choose from your list and our suggestions.</p><button class="btn" onclick="cust()">Choose habits</button>`;
for(const id of on){const dots=[6,5,4,3,2,1,0].map(o=>`<i class="${done(id,day(-o))?"on":""}"></i>`).join("");const wk=[0,1,2,3,4,5,6].filter(o=>done(id,day(-o))).length;
h+=`<div class="h"><button class="chk" aria-pressed="${done(id)}" aria-label="${esc(name(id))}" data-t="${id}">${done(id)?"✓":""}</button><div class="t"><b>${esc(name(id))}</b><div class="dots" aria-hidden="true">${dots}</div></div><span class="mut">${wk}/7 days</span></div>`}
$("#main").innerHTML=h+"</div>";
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{toggle(b.dataset.t);today()})}

/* ---------- Customize ---------- */
function cust(){let h=`<h2 class="serif">What do you track?</h2><p class="mut">Switch on what fits your season. Change it any time.</p>`;
for(const g of ["Your list","Suggested"]){h+=`<h3 class="sub">${g}</h3>`;for(const [id,n] of HABITS.filter(x=>x[2]==g))h+=`<label class="tog"><input type="checkbox" value="${id}" ${S.on.includes(id)?"checked":""}>${n}</label>`}
$("#dlg").innerHTML=h+`<p><button class="btn" id="ok">Save</button></p>`;$("#dlg").showModal();
$("#ok").onclick=()=>{S.on=[...document.querySelectorAll("#dlg input:checked")].map(i=>i.value);save();$("#dlg").close();go(tab)}}
$("#cust").onclick=cust;

/* ---------- Bible ---------- */
const BOOKS="Genesis,Exodus,Leviticus,Numbers,Deuteronomy,Joshua,Judges,Ruth,1 Samuel,2 Samuel,1 Kings,2 Kings,1 Chronicles,2 Chronicles,Ezra,Nehemiah,Esther,Job,Psalms,Proverbs,Ecclesiastes,Song of Solomon,Isaiah,Jeremiah,Lamentations,Ezekiel,Daniel,Hosea,Joel,Amos,Obadiah,Jonah,Micah,Nahum,Habakkuk,Zephaniah,Haggai,Zechariah,Malachi,Matthew,Mark,Luke,John,Acts,Romans,1 Corinthians,2 Corinthians,Galatians,Ephesians,Philippians,Colossians,1 Thessalonians,2 Thessalonians,1 Timothy,2 Timothy,Titus,Philemon,Hebrews,James,1 Peter,2 Peter,1 John,2 John,3 John,Jude,Revelation".split(",");
const TR={web:"World English Bible",kjv:"King James Version",bbe:"Bible in Basic English","oeb-us":"Open English Bible"};
async function fetchPassage(ref,tr,el,markId){
el.innerHTML=`<p class="mut">Loading…</p>`;
try{const r=await fetch(`https://bible-api.com/${encodeURIComponent(ref)}?translation=${tr}`);if(!r.ok)throw 0;const j=await r.json();
el.innerHTML=`<h3 class="serif">${esc(j.reference)}</h3><p class="mut">${esc(j.translation_name||TR[tr])}</p><div class="verses">${j.verses.map(v=>`<p><sup>${v.verse}</sup>${esc(v.text.trim())}</p>`).join("")}</div>${markId?`<p><button class="btn" id="mk">${done(markId)?"Marked done ✓":"Mark "+name(markId).toLowerCase()+" done"}</button></p>`:""}`;
if(markId)$("#mk").onclick=e=>{mark(markId);e.target.textContent="Marked done ✓"};return true}
catch(e){el.innerHTML=`<p class="err">Couldn't load ${esc(ref)}. Check your connection or try another chapter.</p>`;return false}}
function bible(){
$("#main").innerHTML=`<div class="card"><div class="row"><select id="bk" aria-label="Book">${BOOKS.map(b=>`<option ${b==S.book?"selected":""}>${b}</option>`).join("")}</select><input id="ch" type="number" min="1" value="${S.ch}" style="width:80px" aria-label="Chapter"></div>
<select id="tr" aria-label="Translation">${Object.entries(TR).map(([k,v])=>`<option value="${k}" ${k==S.tr?"selected":""}>${v}</option>`).join("")}</select>
<div class="row"><button class="btn ghost" id="pv">Previous</button><button class="btn" id="go" style="flex:1">Read</button><button class="btn ghost" id="nx">Next</button></div></div><div class="card" id="txt"></div>`;
const load=async(dir)=>{S.book=$("#bk").value;S.ch=Math.max(1,+$("#ch").value||1);S.tr=$("#tr").value;save();
const ok=await fetchPassage(`${S.book} ${S.ch}`,S.tr,$("#txt"),"bible");
if(!ok&&dir>0){const i=BOOKS.indexOf(S.book);if(i<65){S.book=BOOKS[i+1];S.ch=1;$("#bk").value=S.book;$("#ch").value=1;save();fetchPassage(`${S.book} 1`,S.tr,$("#txt"),"bible")}}};
$("#go").onclick=()=>load(0);$("#pv").onclick=()=>{$("#ch").value=Math.max(1,$("#ch").value-1);load(-1)};$("#nx").onclick=()=>{$("#ch").value=+$("#ch").value+1;load(1)};load(0)}

/* ---------- Devotionals ---------- */
const doy=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5),dom=new Date().getDate();
const PLANS=[
["Proverbs: wisdom for the day","One chapter a day, restarting each month.",`Proverbs ${dom}`],
["Psalms: pray the prayers","Cycle through all 150 psalms over the year.",`Psalm ${doy%150+1}`],
["Gospel of John","Meet Jesus, one chapter at a time.",`John ${doy%21+1}`],
["Sermon on the Mount","Matthew 5 to 7, a core text for living it out.",`Matthew ${5+doy%3}`],
["Romans: the gospel explained","A chapter a day through Paul's big argument.",`Romans ${doy%16+1}`],
["Acts: the early church","How the first believers lived and shared their faith.",`Acts ${doy%28+1}`]];
const Q=["What does this passage say about who God is?","What is one thing to believe, change, or do today?","Who could you pray for or encourage because of this?"];
function devos(){
$("#main").innerHTML=`<p class="mut">Free, open-text readings. Tap a plan to read it here.</p>`+PLANS.map((p,i)=>`<div class="card"><h3 class="serif">${p[0]}</h3><p class="mut">${p[1]}</p><button class="btn" data-p="${i}">Read ${p[2]}</button></div>`).join("")+`<div class="card" id="dv" hidden></div><div class="card"><h3 class="serif">More free classics</h3><p class="mut">These open in your browser.</p><p><a href="https://ccel.org" target="_blank" rel="noopener">Christian Classics Ethereal Library</a><br><a href="https://www.biblegateway.com/devotionals/" target="_blank" rel="noopener">Bible Gateway devotionals</a></p></div>`;
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{const p=PLANS[b.dataset.p],el=$("#dv");el.hidden=false;el.scrollIntoView({behavior:"smooth"});
await fetchPassage(p[2],S.tr,el,"devo");el.insertAdjacentHTML("beforeend",`<h3 class="sub serif">Reflect</h3><ol>${Q.map(q=>`<li>${q}</li>`).join("")}</ol>`)})}

/* ---------- Church ---------- */
const MO="(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?\\s+\\d{1,2}",WD="(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*",TM="\\d{1,2}(?::\\d{2})?\\s?(?:am|pm|a\\.m\\.|p\\.m\\.)";
const RX=new RegExp(`(${MO}(?:st|nd|rd|th)?|\\b\\d{1,2}/\\d{1,2}(?:/\\d{2,4})?\\b|\\b${WD}\\b|${TM})`,"gi");
function church(){
$("#main").innerHTML=`<div class="card"><h3 class="serif">Give</h3><p class="mut">Paste your church's giving link. Giving pages open in your browser for security.</p><input id="tl" type="url" placeholder="https://yourchurch.org/give" value="${esc(S.tithe)}" aria-label="Giving link"><div class="row"><button class="btn" id="ts">Save link</button><button class="btn ghost" id="tg">Give now</button></div><p id="tm" class="mut"></p></div>
<div class="card"><h3 class="serif">Church links</h3><p class="mut">Save your church's website and social pages for one-tap access.</p><div class="row"><input id="ln" placeholder="Name (Instagram)" aria-label="Link name"><input id="lu" type="url" placeholder="https://" aria-label="Link URL"></div><button class="btn ghost" id="la">Add link</button><div id="ll"></div></div>
<div class="card"><h3 class="serif">Find meetings and announcements</h3><p class="mut">Instagram, Facebook, and TikTok block apps from reading their pages. Copy the post, newsletter, or web page text and paste it here. Ember pulls out lines with dates and times.</p><textarea id="an" rows="5" placeholder="Paste announcements here"></textarea><button class="btn" id="ax">Find events</button><div id="ao"></div></div>`;
const links=()=>{$("#ll").innerHTML=S.links.map((l,i)=>`<div class="h"><a class="t" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.n)}</a><button class="btn ghost" data-r="${i}">Remove</button></div>`).join("");document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.links.splice(b.dataset.r,1);save();links()})};links();
const ok=u=>/^https?:\/\//i.test(u);
$("#ts").onclick=()=>{const u=$("#tl").value.trim();if(u&&!ok(u)){$("#tm").textContent="Link must start with http:// or https://";return}S.tithe=u;save();$("#tm").textContent="Saved."};
$("#tg").onclick=()=>{if(!S.tithe){$("#tm").textContent="Paste and save your giving link first.";return}window.open(S.tithe,"_blank","noopener");mark("tithe")};
$("#la").onclick=()=>{const u=$("#lu").value.trim(),n=$("#ln").value.trim()||u;if(!ok(u))return;S.links.push({n,u});save();$("#ln").value=$("#lu").value="";links()};
$("#ax").onclick=()=>{const L=$("#an").value.split(/\n+/).map(s=>s.trim()).filter(s=>s.length>5);const hits=L.filter(l=>{RX.lastIndex=0;return RX.test(l)});
$("#ao").innerHTML=hits.length?hits.map(l=>`<div class="h"><span>${esc(l).replace(RX,m=>`<mark>${m}</mark>`)}</span></div>`).join(""):`<p class="mut">No dates or times found. Paste text that includes them.</p>`}}

/* ---------- Grow ---------- */
const G=[
["Lead a small group",["Start with a clear purpose: study, prayer, or community. Say it out loud in week one.","Prepare 3 to 5 open questions, not a lecture. Aim to talk about a third of the time.","Begin with a simple icebreaker and end with prayer requests, then follow up during the week.","Create safety: confidentiality, no fixing or interrupting, and never force anyone to share.","Pray for each member by name and invite others to lead sections so the group grows leaders."]],
["Public speaking",["Build around one main idea you can say in a sentence.","Open with a story or question, give two or three points, close with one clear action.","Speak slower than feels natural and pause between points. Silence is fine.","Practice out loud three times, once standing, and time yourself.","Look at friendly faces, breathe, and remember you are serving, not performing."]],
["Share your testimony",["Keep it to 3 minutes: life before, how you met Jesus, life since.","Be specific and honest. Skip church jargon a friend wouldn't understand.","Focus on what Jesus did, not on how bad or good you were.","Close with one sentence that invites a question or a next step.","Write it down and rehearse it with a friend so it feels natural."]],
["Witnessing: neighbors, friends, strangers",["Pray first, then look for natural openings: needs, questions, and stories.","Neighbors: build trust through meals, help, and consistency. Friends: be honest about your faith without pressure.","Strangers: be kind, ask permission to share, and listen more than you talk.","Ask questions like \"What do you think happens after we die?\" and really listen.","Share your story, offer a Bible or invite them to church, and accept a no with grace."]]];
const POD={
"Nondenominational / Evangelical":["The Bible Project","Ask Pastor John","The Craig Groeschel Leadership Podcast"],
"Baptist":["Ask Pastor John","The Briefing with Albert Mohler","The Gospel Coalition Podcast"],
"Reformed / Presbyterian":["Renewing Your Mind","The Gospel Coalition Podcast","Ask Pastor John"],
"Catholic":["Pray as You Go","The Bishop Barron Podcast","Catholic Answers Live"],
"Methodist / Wesleyan":["Seedbed Daily Text","The Bible Project","Pray as You Go"],
"Pentecostal / Charismatic":["Elevation with Steven Furtick","The Craig Groeschel Leadership Podcast","The Bible Project"],
"Lutheran":["Issues, Etc.","The Lutheran Hour","The Bible Project"],
"Orthodox":["Ancient Faith Today","Lord Have Mercy","Ancient Faith Radio"],
"Anglican / Episcopal":["Mere Fidelity","Ask NT Wright Anything","The Bible Project"]};
function grow(){
$("#main").innerHTML=`<div class="card"><h3 class="serif">Guides</h3>${G.map(g=>`<details><summary>${g[0]}</summary><ul>${g[1].map(x=>`<li>${x}</li>`).join("")}</ul></details>`).join("")}</div>
<div class="card"><h3 class="serif">Podcasts for your church family</h3><label class="mut" for="dn">Your tradition</label><select id="dn">${Object.keys(POD).map(k=>`<option ${k==S.denom?"selected":""}>${k}</option>`).join("")}</select><div id="po"></div><p class="mut">Links open an Apple Podcasts search. Always compare with what your own pastor teaches.</p></div>`;
const pods=()=>{$("#po").innerHTML=POD[S.denom].map(p=>`<div class="h"><span class="t">${esc(p)}</span><a class="btn ghost" target="_blank" rel="noopener" href="https://podcasts.apple.com/us/search?term=${encodeURIComponent(p)}">Listen</a></div>`).join("")};
$("#dn").onchange=e=>{S.denom=e.target.value;save();pods()};pods()}

/* ---------- Router ---------- */
const TABS=[["today","Today",today],["bible","Bible",bible],["devos","Devos",devos],["church","Church",church],["grow","Grow",grow]];
let tab="today";
$("#nav").innerHTML=TABS.map(t=>`<button role="tab" data-n="${t[0]}">${t[1]}</button>`).join("");
function go(n){tab=n;document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.n==n));TABS.find(t=>t[0]==n)[2]();$("#main").scrollTop=0}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.n));
go("today");
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
